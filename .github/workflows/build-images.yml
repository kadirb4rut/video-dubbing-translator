name: Build and publish production images

on:
  push:
    branches:
      - codex/production-saas
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag, for example a commit SHA"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-images
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-north-1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-actions-image-publish

      - name: Log in to Amazon ECR
        id: ecr
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          repository_uri="$(aws ecr describe-repositories --repository-names lingowave-worker --query 'repositories[0].repositoryUri' --output text)"
          api_repository_uri="$(aws ecr describe-repositories --repository-names lingowave-api --query 'repositories[0].repositoryUri' --output text)"
          registry="${repository_uri%%/*}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          echo "repository_uri=$repository_uri" >> "$GITHUB_OUTPUT"
          echo "api_repository_uri=$api_repository_uri" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.ecr.outputs.api_repository_uri }}:${{ steps.ecr.outputs.image_tag }}

      - name: Build and push GPU worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.worker
          build-args: WORKER_REQUIREMENTS=requirements.worker-gpu.txt
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.ecr.outputs.repository_uri }}:${{ steps.ecr.outputs.image_tag }}

      - name: Build and push CPU worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.worker
          build-args: |
            WORKER_REQUIREMENTS=requirements.worker-cpu-full.txt
            INSTALL_CHATTERBOX=true
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.ecr.outputs.repository_uri }}:${{ steps.ecr.outputs.image_tag }}-cpu

      - name: Verify published image manifests
        env:
          IMAGE_TAG: ${{ steps.ecr.outputs.image_tag }}
          REPOSITORY_URI: ${{ steps.ecr.outputs.repository_uri }}
        run: |
          aws ecr describe-images --repository-name lingowave-worker --image-ids imageTag="$IMAGE_TAG"
          aws ecr describe-images --repository-name lingowave-worker --image-ids imageTag="${IMAGE_TAG}-cpu"
