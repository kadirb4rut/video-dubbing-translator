name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ci.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit and fixture-based tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q
      - name: Run browser extension tests
        run: node --test tests/*.mjs
      - name: Validate launch scripts
        run: |
          bash -n start_gui.sh
          bash -n start_gui.command
          bash -n install.sh
          bash -n scripts/create_demo_comparison.sh
