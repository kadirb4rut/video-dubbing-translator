name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run dependency-free unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate launch scripts
        run: |
          bash -n start_gui.sh
          bash -n start_gui.command
          bash -n install.sh
          bash -n scripts/create_demo_comparison.sh
