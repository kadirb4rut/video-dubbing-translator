name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r backend/requirements-dev.txt
      - run: pip install ruff bandit pip-audit
      - run: pip-audit -r backend/requirements-dev.txt --progress-spinner off
      - run: ruff check backend/app backend/tests scripts
      - run: bandit -q -r backend/app --severity-level medium
      - run: PYTHONPATH=backend pytest -q backend/tests
      - run: python -m compileall -q backend/app backend/tests scripts
      - run: DATABASE_URL=sqlite:////tmp/lingowave-ci.db PYTHONPATH=. alembic upgrade head
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: if grep -R 'localhost:8000' dist/assets; then echo 'Production bundle must use same-origin API routing.'; exit 1; fi
        working-directory: frontend
      - run: docker compose config
        working-directory: .
      - run: docker build --file backend/Dockerfile --tag lingowave-api:ci .
      - run: docker build --file backend/Dockerfile.worker --build-arg WORKER_REQUIREMENTS=requirements.worker-cpu.txt --tag lingowave-worker-cpu:ci .
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
      - run: terraform fmt -check -recursive
        working-directory: infrastructure/terraform
      - run: terraform init -backend=false -input=false
        working-directory: infrastructure/terraform
      - run: terraform validate
        working-directory: infrastructure/terraform
