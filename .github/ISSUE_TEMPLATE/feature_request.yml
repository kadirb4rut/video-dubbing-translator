name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest practical solution.
    validations:
      required: true
  - type: textarea
    id: licensing
    attributes:
      label: Licensing and privacy impact
      description: List any new model, dataset, dependency, external service, or data leaving the machine.
    validations:
      required: true
